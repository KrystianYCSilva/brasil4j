name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['8', '21']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: corretto
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test and verify
        run: sh ./mvnw -B -ntp clean verify
      - name: Check Java 8 bytecode
        run: python3 scripts/check-bytecode.py

      - name: Check API compatibility against v0.1.0
        if: matrix.java == '21'
        shell: bash
        run: |
          # Commit apontado pela tag v0.1.0.
          baseline_commit='8a6780d61a8d0ee036fe5ec134da906b596a2fb8'
          git fetch --no-tags --depth=1 origin "$baseline_commit"
          baseline="$RUNNER_TEMP/brasil4j-v0.1.0"
          mkdir -p "$baseline"
          git archive "$baseline_commit" | tar -x -C "$baseline"
          (cd "$baseline" && sh ./mvnw -B -ntp -Dmaven.test.skip=true package)

          japicmp="$RUNNER_TEMP/japicmp-0.26.1.jar"
          curl --fail --silent --show-error --location --retry 3 \
            'https://repo.maven.apache.org/maven2/com/github/siom79/japicmp/japicmp/0.26.1/japicmp-0.26.1-jar-with-dependencies.jar' \
            --output "$japicmp"
          printf '%s  %s\n' '4b4f0301861d97cd2a05af3f7fa9173cc1dd3831b1284b2b9e2f81c4f1c2f858' "$japicmp" | sha256sum --check
          python3 scripts/check-api-compatibility.py "$baseline" . "$japicmp" "$HOME/.m2/repository"
