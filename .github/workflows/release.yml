name: Release

# GF-4: a tag vX.Y.Z on main publishes a GitHub Release with the JARs and the CHANGELOG section.
# Maven Central publication is pending namespace approval and is not part of this workflow.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  guard:
    name: release-guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Tag commit must be on main and match the POM version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $tag is not on main"; exit 1; }
          pom_version="$(sed -n '0,/<version>/s:.*<version>\(.*\)</version>.*:\1:p' pom.xml)"
          [ "$pom_version" = "$version" ] || { echo "POM version $pom_version does not match tag $tag"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: guard
    uses: ./.github/workflows/verify.yml

  publish:
    name: github-release
    needs: [guard, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Build artifacts
        run: sh ./mvnw -B -ntp -Dmaven.test.skip=true package
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v " " {f=1; next} /^## / && f {exit} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Release $VERSION" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "brasil4j-core/target/brasil4j-core-$VERSION.jar" \
            "brasil4j-kotlin/target/brasil4j-kotlin-$VERSION.jar" \
            --title "brasil4j $VERSION" --notes-file release-notes.md --verify-tag
